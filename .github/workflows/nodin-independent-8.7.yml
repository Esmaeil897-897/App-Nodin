name: Nodin 8.7 Independent Android
on:
  push:
    branches: [nodin-8.7-independent-android]
    paths:
      - 'Nodin-Source-8.7-independent.zip'
      - '.github/workflows/nodin-independent-8.7.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nodin-independent-8-7-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack independent source
        run: unzip -q Nodin-Source-8.7-independent.zip -d independent-build
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile and lint APK
        working-directory: independent-build/Nodin-8.7
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify APK signature and package
        working-directory: independent-build/Nodin-8.7
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Nodin-8.7-independent.apk
          sha256sum Nodin-8.7-independent.apk > Nodin-8.7-independent.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Nodin-8.7-independent-Android-APK
          path: |
            independent-build/Nodin-8.7/Nodin-8.7-independent.apk
            independent-build/Nodin-8.7/Nodin-8.7-independent.apk.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Nodin-8.7-build-reports
          path: independent-build/Nodin-8.7/app/build/reports/
