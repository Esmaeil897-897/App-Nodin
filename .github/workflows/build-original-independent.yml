name: Nodin Original Source - Independent APK
on:
  push:
    branches: [nodin-original-source-build]
    paths: ['.github/workflows/build-original-independent.yml', 'nodin-9.4.patch.gz.b64', 'Nodin-Source-9.3.zip']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore actual Android project and apply newer source patch
        shell: bash
        run: |
          set -euo pipefail
          unzip -q Nodin-Source-9.3.zip -d source
          mv source/Nodin-9.3 source/Nodin-Original
          base64 -d nodin-9.4.patch.gz.b64 | gzip -d > /tmp/nodin.patch
          (cd source/Nodin-Original && patch -p1 < /tmp/nodin.patch)
      - name: Make application independently installable
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('source/Nodin-Original')
          candidates=list(root.rglob('build.gradle'))+list(root.rglob('build.gradle.kts'))
          changed=[]
          for f in candidates:
              if any(x in f.parts for x in ('build','.gradle')): continue
              s=f.read_text()
              if 'com.nodin.english.stable' in s and 'applicationId' in s:
                  import re
                  t=re.sub(r'(applicationId\s*(?:=\s*)?[\x22\x27])com\.nodin\.english\.stable([\x22\x27])',r'\1com.nodin.original.independent\2',s)
                  if t!=s: f.write_text(t);changed.append(str(f))
          if not changed: raise SystemExit('No Android applicationId found; refusing a conflicting install')
          print('Changed applicationId in',changed)
          PY
      - name: Build real native Android application
        working-directory: source/Nodin-Original
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Package APK and full buildable source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          find source/Nodin-Original/app/build/outputs/apk -name '*.apk' -type f -print
          cp source/Nodin-Original/app/build/outputs/apk/debug/app-debug.apk output/Nodin-Original-Independent.apk
          (cd source && zip -qr ../output/Nodin-Original-Source.zip Nodin-Original -x '*/build/*' '*/.gradle/*' '*/.tts-build-cache/*')
          sha256sum output/* > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nodin-Original-Independent-APK
          path: output/Nodin-Original-Independent.apk
          retention-days: 60
      - uses: actions/upload-artifact@v4
        with:
          name: Nodin-Original-Source-Code
          path: |
            output/Nodin-Original-Source.zip
            output/SHA256SUMS.txt
          retention-days: 60
