name: Nodin Layers 9.0 Android
on:
  push:
    branches: [nodin-9.0-layers]
    paths: ['Nodin-Layers-9.0-Source.zip', '.github/workflows/nodin-layers-9.0.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nodin-layers-9-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack isolated source
        run: unzip -q Nodin-Layers-9.0-Source.zip -d layers-build
      - name: Use preinstalled Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Test AI relay contract
        run: python3 -m unittest discover -s layers-build/Nodin-9.0/ai-server -p 'test_*.py'
      - name: Compile Android app and UI tests; lint
        working-directory: layers-build/Nodin-9.0
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native layer selection and conversation on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15917651
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd layers-build/Nodin-9.0 && gradle --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=com.nodin.english.LayersTest :app:connectedDebugAndroidTest
            adb shell am force-stop com.nodin.english.layers
            adb shell am start -n com.nodin.english.layers/com.nodin.english.LayersActivity
            sleep 3
            adb shell screencap -p /sdcard/nodin-layers.png
            adb pull /sdcard/nodin-layers.png layers-build/Nodin-9.0/nodin-layers.png
      - name: Verify signature and package
        working-directory: layers-build/Nodin-9.0
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk Nodin-Layers-9.0.apk
          sha256sum Nodin-Layers-9.0.apk > Nodin-Layers-9.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Nodin-Layers-9.0-Android
          path: |
            layers-build/Nodin-9.0/Nodin-Layers-9.0.apk
            layers-build/Nodin-9.0/Nodin-Layers-9.0.apk.sha256
            layers-build/Nodin-9.0/nodin-layers.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nodin-Layers-9.0-Reports
          path: layers-build/Nodin-9.0/app/build/reports/
