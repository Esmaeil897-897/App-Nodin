name: Nodin 9.4 Learning Studio
on:
  push:
    branches: [nodin-9.4-learning-studio]
    paths: [nodin-9.4.patch.gz.b64, '.github/workflows/build-nodin-9.4.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract source
        run: |
          unzip -q Nodin-Source-9.3.zip -d source
          mv source/Nodin-9.3 source/Nodin-9.4
          base64 -d nodin-9.4.patch.gz.b64 | gzip -d > /tmp/nodin.patch
          cd source/Nodin-9.4
          patch -p1 < /tmp/nodin.patch
      - name: Licensed offline photographs
        run: |
          python -m pip install Pillow
          python source/Nodin-9.4/tools/fetch_photos.py
      - name: Build and lint
        working-directory: source/Nodin-9.4
        run: gradle assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - name: Package outputs
        run: |
          mkdir -p output
          cp source/Nodin-9.4/app/build/outputs/apk/debug/app-debug.apk output/Nodin-9.4.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" output/apksigner.jar
          cp source/Nodin-9.4/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/Nodin-9.4-test.apk
          cp source/Nodin-9.4/app/src/main/assets/learning/photos-contact-sheet.jpg output/
          cp source/Nodin-9.4/app/src/main/assets/learning/photos.json output/
          cd source
          zip -qr ../output/Nodin-Source-9.4.zip Nodin-9.4 -x '*/build/*' '*/.gradle/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nodin-9.4-build-diagnostics
          path: |
            source/Nodin-9.4/app/build/reports
            source/Nodin-9.4/app/src/main/assets/learning/photos-contact-sheet.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: Nodin-9.4-Android
          path: output/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r output/Nodin-9.4.apk
            adb install -r output/Nodin-9.4-test.apk
            adb shell am instrument -w -e class com.nodin.english.LearningHubTest,com.nodin.english.LayersTest,com.nodin.english.DialogueTest com.nodin.english.stable.test/androidx.test.runner.AndroidJUnitRunner | tee output/instrumentation.txt
            grep -q 'OK (' output/instrumentation.txt
            adb shell am start -n com.nodin.english.stable/com.nodin.english.LayersActivity --ez learningHub true
            sleep 3
            adb shell screencap -p /sdcard/nodin-learning.png
            adb pull /sdcard/nodin-learning.png output/nodin-learning.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nodin-9.4-tests
          path: output/
