name: Nodin 9.6 Learning Studio
on:
  push:
    branches: [nodin-9.4-learning-studio]
    paths: [nodin-9.4.patch.gz.b64, '.github/workflows/build-nodin-9.4.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract source
        run: |
          unzip -q Nodin-Source-9.3.zip -d source
          mv source/Nodin-9.3 source/Nodin-9.6
          base64 -d nodin-9.4.patch.gz.b64 | gzip -d > /tmp/nodin.patch
          cd source/Nodin-9.6
          patch -p1 < /tmp/nodin.patch
      - uses: actions/download-artifact@v4
        with:
          name: Nodin-9.4-Android
          run-id: 38315983358
          github-token: ${{ github.token }}
          path: reviewed-photo-cache
      - name: Reuse reviewed offline photographs
        run: python source/Nodin-9.6/tools/reuse_photos.py
      - name: Build reviewed driving theory content
        run: |
          python source/Nodin-9.6/tools/fix_classic_translations.py
          python source/Nodin-9.6/tools/fetch_theory_images.py
          python source/Nodin-9.6/tools/build_theory_assets.py
      - name: Validate service contract
        run: python -m unittest discover -s source/Nodin-9.6/server -v
      - name: Build and lint
        working-directory: source/Nodin-9.6
        run: gradle assembleDebug assembleDebugAndroidTest lintDebug --no-daemon
      - name: Package outputs
        run: |
          mkdir -p output
          cp source/Nodin-9.6/app/build/outputs/apk/debug/app-debug.apk output/Nodin-9.6.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" output/apksigner.jar
          cp source/Nodin-9.6/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk output/Nodin-9.6-test.apk
          cp source/Nodin-9.6/app/src/main/assets/learning/photos-contact-sheet.jpg output/
          cp source/Nodin-9.6/app/src/main/assets/learning/photos.json output/
          cp source/Nodin-9.6/app/src/main/assets/learning/packs/*.json output/
          cd source
          zip -qr ../output/Nodin-Source-9.6.zip Nodin-9.6 -x '*/build/*' '*/.gradle/*'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nodin-9.6-build-diagnostics
          path: |
            source/Nodin-9.6/app/build/reports
            source/Nodin-9.6/app/src/main/assets/learning/photos-contact-sheet.jpg
      - uses: actions/upload-artifact@v4
        with:
          name: Nodin-9.6-Android
          path: output/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r output/Nodin-9.6.apk
            adb install -r output/Nodin-9.6-test.apk
            adb shell am force-stop com.android.launcher3
            adb shell settings put secure tts_default_synth com.nodin.english.stable.test
            adb shell am instrument -w -e class com.nodin.english.LearningHubTest,com.nodin.english.LearningHubUiTest,com.nodin.english.LayersTest,com.nodin.english.SpeechCompatibilityTest,com.nodin.english.DialogueTest,com.nodin.english.TheoryAvatarTest com.nodin.english.stable.test/androidx.test.runner.AndroidJUnitRunner | tee output/instrumentation.txt
            grep -q 'OK (' output/instrumentation.txt
            adb install -r output/Nodin-9.6.apk
            adb shell am force-stop com.nodin.english.stable
            adb shell am start -n com.nodin.english.stable/com.nodin.english.LayersActivity --ez learningHub true
            sleep 3
            adb shell screencap -p /sdcard/nodin-learning.png
            adb pull /sdcard/nodin-learning.png output/nodin-learning.png
            adb shell am force-stop com.nodin.english.stable
            adb shell am start -n com.nodin.english.stable/com.nodin.english.LayersActivity --ez theoryAvatar true
            sleep 2
            adb shell screencap -p /sdcard/nodin-driving-avatar.png
            adb pull /sdcard/nodin-driving-avatar.png output/nodin-driving-avatar.png
      - name: Publish data-only lesson packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nodin-learning-packs >/dev/null 2>&1 || gh release create nodin-learning-packs --title "Nodin learning packs" --notes "Optional authored educational JSON packs. No executable code." --prerelease
          gh release upload nodin-learning-packs output/nodin-*.json --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nodin-9.6-tests
          path: output/
