name: Nodin Native Radio APK
on:
  push:
    branches: [main]
    paths: ['Nodin-Android-Native-Radio.zip', '.github/workflows/native-radio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: unzip -q Nodin-Android-Native-Radio.zip -d native-build
      - name: Set controls two sizes above selected text
        run: |
          cd native-build
          python - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/index.html')
          s=p.read_text()
          needle="document.documentElement.style.setProperty('--font-size-base', size);"
          assert s.count(needle)==1
          s=s.replace(needle,needle+"\n    document.documentElement.style.setProperty('--font-size-controls', (state.fontSize + 2) + 'px');",1)
          css='''<style id="nodin-controls-plus-two">
          :root { --font-size-controls:20px; }
          #settingsPanel, #settingsPanel .field,
          #settingsPanel label, #settingsPanel button, #settingsPanel select,
          #settingsPanel input:not([type="range"]):not([type="checkbox"]),
          #settingsPanel output, #settingsPanel option, #settingsPanel span,
          .masthead-top button, .masthead-top button span,
          nav.tabs button, .bb-time-label, .bb-time-value,
          .bb-time-value.bb-time-date, #dateLine {
            font-size:var(--font-size-controls) !important;
          }
          #settingsPanel .field { min-width:0; max-width:100%; }
          #settingsPanel select { max-width:100%; }
          .masthead-top, .masthead-top .controls { flex-wrap:wrap; }
          .bb-time-value { overflow-wrap:anywhere; }
          </style>'''
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s)
          g=Path('app/build.gradle')
          g.write_text(g.read_text().replace('versionCode 9','versionCode 10').replace('7.2-font-size','7.3-controls-plus-two'))
          PY
      - run: cd native-build && gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Android launch and radio service
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15917651
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd native-build && gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell screencap -p /sdcard/nodin-test.png
            adb pull /sdcard/nodin-test.png nodin-test.png
      - uses: actions/upload-artifact@v4
        with:
          name: Nodin-Controls-Plus-2-APK
          path: native-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
