name: Nodin Native Radio APK
on:
  push:
    branches: [main]
    paths: ['Nodin-Android-Native-Radio.zip', '.github/workflows/native-radio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: unzip -q Nodin-Android-Native-Radio.zip -d native-build
      - run: cd native-build && gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual Android launch and radio service
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15917651
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            cd native-build && gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell screencap -p /sdcard/nodin-test.png
            adb pull /sdcard/nodin-test.png nodin-test.png
      - uses: actions/upload-artifact@v4
        with:
          name: Nodin-Native-Radio-APK
          path: native-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
