name: Nodin Native Radio APK
on:
  push:
    branches: [main]
    paths: ['Nodin-Android-Native-Radio.zip', '.github/workflows/native-radio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: unzip -q Nodin-Android-Native-Radio.zip -d native-build
      - run: cd native-build && gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nodin-Native-Radio-APK
          path: native-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
