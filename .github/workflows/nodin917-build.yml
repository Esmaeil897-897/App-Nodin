name: NODIN 9.17 - Build real Android APK

on:
  workflow_dispatch:
  push:
    branches: [Elin2026]
    paths:
      - ".github/workflows/nodin917-build.yml"

permissions:
  contents: read
  actions: read

jobs:
  build-nodin-917:
    name: Compile NODIN 9.17 source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Elin2026 workflow
        uses: actions/checkout@v4
        with:
          ref: Elin2026

      - name: Download original NODIN 9.17 source artifact
        uses: actions/download-artifact@v4
        with:
          name: Nodin-9.17-source
          path: ${{ runner.temp }}/nodin917-artifact
          repository: ${{ github.repository }}
          run-id: 39063593092
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract original source archive
        shell: bash
        run: |
          set -euo pipefail
          OUTER_ZIP="$(find "${{ runner.temp }}/nodin917-artifact" -type f -name 'Nodin-Source-9.17.zip' -print -quit)"
          test -n "$OUTER_ZIP"
          mkdir -p "${{ runner.temp }}/nodin917-inner"
          unzip -q "$OUTER_ZIP" -d "${{ runner.temp }}/nodin917-inner"
          test -f "${{ runner.temp }}/nodin917-inner/Nodin-9.17/app/build.gradle"
          cp -a "${{ runner.temp }}/nodin917-inner/Nodin-9.17" "${{ github.workspace }}/nodin917-source"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify source and build configuration
        working-directory: nodin917-source
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/libs/sherpa-onnx-1.13.8.aar
          java -version
          gradle --version

      - name: Build installable debug APK from NODIN 9.17 source
        id: build
        working-directory: nodin917-source
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Create build provenance and checksum
        if: steps.build.outcome == 'success'
        working-directory: nodin917-source
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          sha256sum "$APK" > app/build/outputs/apk/debug/SHA256SUMS.txt
          {
            echo "Source: NODIN 9.17"
            echo "Source artifact: Nodin-9.17-source"
            echo "Source workflow run: 39063593092"
            echo "Application ID: com.nodin.english.stable"
            echo "Version: 9.17-studio (versionCode 47)"
            echo "Build: Gradle assembleDebug on GitHub Actions"
            echo "Java: 17"
            echo "Android SDK: 35"
            echo "Gradle: 8.11.1"
          } > app/build/outputs/apk/debug/BUILD-INFO.txt

      - name: Run JVM unit tests
        if: steps.build.outcome == 'success'
        working-directory: nodin917-source
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload genuine NODIN 9.17 APK
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: NODIN-9.17-debug-APK
          path: |
            nodin917-source/app/build/outputs/apk/debug/*.apk
            nodin917-source/app/build/outputs/apk/debug/SHA256SUMS.txt
            nodin917-source/app/build/outputs/apk/debug/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
