name: Nodin 9.3 Classic Autosave
on:
  push:
    branches: [nodin-9.3-classic-autosave]
    paths: ['Nodin-Source-9.3.zip', '.github/workflows/nodin-classic-9.3.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nodin-classic-93-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unpack isolated source
        run: unzip -q Nodin-Source-9.3.zip -d layers-build
      - name: Use Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile and lint
        working-directory: layers-build/Nodin-9.3
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test dialogs and classic persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          emulator-build: 15917651
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell am force-stop com.android.launcher3
            adb shell settings put secure tts_default_synth com.nodin.english.stable.test
            cd layers-build/Nodin-9.3 && gradle --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=com.nodin.english.LayersTest,com.nodin.english.SpeechCompatibilityTest,com.nodin.english.DialogueTest :app:connectedDebugAndroidTest
            adb install -r layers-build/Nodin-9.3/app/build/outputs/apk/debug/app-debug.apk
            adb install -r layers-build/Nodin-9.3/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout 180s adb shell am instrument -w -e class 'com.nodin.english.ClassicPersistenceTest#aFolderAutosaveRecoveryAndReset' com.nodin.english.stable.test/androidx.test.runner.AndroidJUnitRunner | tee layers-build/Nodin-9.3/classic-test.txt
            adb logcat -d -v threadtime > layers-build/Nodin-9.3/emulator-logcat.txt
            test "$(grep -c 'OK (1 test)' layers-build/Nodin-9.3/classic-test.txt)" -eq 1
            timeout 180s adb shell am instrument -w -e class 'com.nodin.english.ClassicPersistenceTest#bPrepareUpgradeData' com.nodin.english.stable.test/androidx.test.runner.AndroidJUnitRunner | tee layers-build/Nodin-9.3/seed-test.txt
            adb logcat -d -v threadtime > layers-build/Nodin-9.3/emulator-logcat.txt
            test "$(grep -c 'OK (1 test)' layers-build/Nodin-9.3/seed-test.txt)" -eq 1
            cd layers-build/Nodin-9.3 && gradle --no-daemon -PnodinVersionCode=34 :app:assembleDebug
            adb install -r layers-build/Nodin-9.3/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.nodin.english.stable.test
            adb shell am force-stop com.nodin.english.stable
            timeout 180s adb shell am instrument -w -e class 'com.nodin.english.ClassicPersistenceTest#cVerifyUpgradeData' com.nodin.english.stable.test/androidx.test.runner.AndroidJUnitRunner | tee layers-build/Nodin-9.3/upgrade-test.txt
            adb logcat -d -v threadtime > layers-build/Nodin-9.3/emulator-logcat.txt
            test "$(grep -c 'OK (1 test)' layers-build/Nodin-9.3/upgrade-test.txt)" -eq 1
            adb shell am force-stop com.nodin.english.stable
            adb shell run-as com.nodin.english.stable rm files/classic-progress.json
            adb shell run-as com.nodin.english.stable rm -rf app_webview
            timeout 180s adb shell am instrument -w -e class 'com.nodin.english.ClassicPersistenceTest#cVerifyUpgradeData' com.nodin.english.stable.test/androidx.test.runner.AndroidJUnitRunner | tee layers-build/Nodin-9.3/folder-recovery-test.txt
            adb logcat -d -v threadtime > layers-build/Nodin-9.3/emulator-logcat.txt
            test "$(grep -c 'OK (1 test)' layers-build/Nodin-9.3/folder-recovery-test.txt)" -eq 1
            keytool -genkeypair -alias androiddebugkey -keyalg RSA -keystore /tmp/nodin-test-different.jks -storepass android -keypass android -dname 'CN=Different test signer' -validity 365 -noprompt
            cd layers-build/Nodin-9.3 && gradle --no-daemon -PnodinVersionCode=35 -PnodinTestKeystore=/tmp/nodin-test-different.jks :app:assembleDebug :app:assembleDebugAndroidTest
            adb uninstall com.nodin.english.stable.test
            adb uninstall com.nodin.english.stable
            adb install layers-build/Nodin-9.3/app/build/outputs/apk/debug/app-debug.apk
            adb install layers-build/Nodin-9.3/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout 180s adb shell am instrument -w -e class 'com.nodin.english.ClassicPersistenceTest#dDifferentSignatureFolderRecovery' com.nodin.english.stable.test/androidx.test.runner.AndroidJUnitRunner | tee layers-build/Nodin-9.3/different-signature-test.txt
            adb logcat -d -v threadtime > layers-build/Nodin-9.3/emulator-logcat.txt
            test "$(grep -c 'OK (1 test)' layers-build/Nodin-9.3/different-signature-test.txt)" -eq 1
            adb pull /sdcard/nodin-classic-autosave-9.3.png layers-build/Nodin-9.3/nodin-classic-autosave-9.3.png
      - name: Prepare unsigned release for private stable signing
        working-directory: layers-build/Nodin-9.3
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
          cp app/build/outputs/apk/release/app-release-unsigned.apk Nodin-9.3-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Nodin-9.3-unsigned.apk
          sha256sum Nodin-9.3-unsigned.apk > Nodin-9.3-unsigned.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Nodin-9.3-Android
          path: |
            layers-build/Nodin-9.3/Nodin-9.3-unsigned.apk*
            layers-build/Nodin-9.3/signing-tools/apksigner.jar
            layers-build/Nodin-9.3/nodin-classic-autosave-9.3.png
            layers-build/Nodin-9.3/*-test.txt
            layers-build/Nodin-9.3/emulator-logcat.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nodin-9.3-Reports
          path: |
            layers-build/Nodin-9.3/app/build/reports/
            layers-build/Nodin-9.3/*-test.txt
            layers-build/Nodin-9.3/emulator-logcat.txt
