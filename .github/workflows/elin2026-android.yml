name: Elin2026 Android CI

on:
  push:
    branches: [Elin2026]
    paths:
      - "elin2026/**"
      - ".github/workflows/elin2026-android.yml"
  pull_request:
    branches: [Elin2026]
    paths:
      - "elin2026/**"
      - ".github/workflows/elin2026-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elin2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Run Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Pixel_2
          script: cd elin2026 && gradle connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: Elin2026-debug-apk
          path: elin2026/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
