name: Elin2026 Android CI

on:
  push:
    branches: [Elin2026]
    paths:
      - "elin2026/**"
      - ".github/workflows/elin2026-android.yml"
  pull_request:
    branches: [Elin2026]
    paths:
      - "elin2026/**"
      - ".github/workflows/elin2026-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ELIN_SIGNING_ENABLED: ${{ secrets.ELIN_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: elin2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Run Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          script: cd elin2026 && gradle connectedDebugAndroidTest
      - name: Prepare private release key
        if: env.ELIN_SIGNING_ENABLED == 'true'
        env:
          ELIN_KEYSTORE_BASE64: ${{ secrets.ELIN_KEYSTORE_BASE64 }}
          ELIN_KEYSTORE_PASSWORD: ${{ secrets.ELIN_KEYSTORE_PASSWORD }}
          ELIN_KEY_ALIAS: ${{ secrets.ELIN_KEY_ALIAS }}
          ELIN_KEY_PASSWORD: ${{ secrets.ELIN_KEY_PASSWORD }}
        run: |
          echo "$ELIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/elin2026-release.jks"
          echo "ELIN_KEYSTORE_PATH=$RUNNER_TEMP/elin2026-release.jks" >> "$GITHUB_ENV"
          echo "ELIN_KEYSTORE_PASSWORD=$ELIN_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ELIN_KEY_ALIAS=$ELIN_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ELIN_KEY_PASSWORD=$ELIN_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: env.ELIN_SIGNING_ENABLED == 'true'
        run: gradle assembleRelease
      - name: Upload signed release APK
        if: env.ELIN_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Elin2026-release-apk
          path: elin2026/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Elin2026-debug-apk
          path: elin2026/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
